<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Monitor Estacionamiento UAI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
        }
        h1 { color: #333; }
        
        /* Círculo indicador */
        #indicador {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background-color: gray; /* Gris por defecto */
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3em;
            font-weight: bold;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transition: background-color 0.5s ease;
        }
    </style>

    <!-- Librerías de Firebase (v8 compat) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <h1>Sensor 1 - Campus UAI</h1>
    <div id="indicador">CARGANDO...</div>

    <script>
        // 1. Configuración de Firebase (Copia esto desde la consola de Firebase > Configuración del proyecto > General)
        const firebaseConfig = {
            authDomain: "estacionamiento-uai.firebaseapp.com",
            databaseURL: "https://estacionamiento-uai-default-rtdb.firebaseio.com",
            projectId: "estacionamiento-uai",
        };

        // 2. Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // 3. Conectar el HTML con el estado
        const indicador = document.getElementById('indicador');

        // 4. Escuchar cambios en la base de datos en tiempo real
        const sensorRef = database.ref('/sensor_1/estado');
        
        sensorRef.on('value', (snapshot) => {
            const estado = snapshot.val();
            
            indicador.innerText = estado;

            if (estado === "LIBRE") {
                indicador.style.backgroundColor = "#4CAF50"; // Verde
            } else if (estado === "OCUPADO") {
                indicador.style.backgroundColor = "#F44336"; // Rojo
            } else {
                indicador.style.backgroundColor = "gray"; // Desconectado o error
            }
        });
    </script>
</body>
</html>
